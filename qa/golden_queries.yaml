      - "種別1はFLASH 93/5Dh、種別2は91/5Bhを使う"
      - "タグ待ち時間とホスト全体timeoutは別"

  - id: GQ-281
    question: "ThroughCmdは種別7以外なら送信データを249 byteまで入れてよいですか。"
    expected_source_files:
      - "docs/current/commands/cards/55_ff_uhf_through_cmd.md"
    must_include_facts:
      - "原典p.308の送信データは1～247 byte"
      - "LENは種別7以外6+n、種別7は8+n"
      - "空き容量計算だけで上限を拡張しない"
      - "送信bit長の細条件は未確認"

  - id: GQ-282
    question: "ThroughCmdのRead例は49 bitなのに7 byte返ります。全56 bitをデータとして使いますか。"
    expected_source_files:
      - "docs/current/commands/cards/55_ff_uhf_through_cmd.md"
    must_include_facts:
      - "Header1+データ16+Handle16+CRC16で49 bit"
      - "有効bitは上位詰めで下位7 bitは解析対象外"
      - "一般に余りbitが0とは保証しない"
      - "Headerを解釈してコマンド固有の結果を確認する"

  - id: GQ-283
    question: "ThroughCmdで受信するACKのフィールド順を教えてください。"
    expected_source_files:
      - "docs/current/commands/cards/55_ff_uhf_through_cmd.md"
    must_include_facts:
      - "FFh、動作パラメータのエコー、受信bit長2 byte、受信bit列"
      - "受信データありならLEN=4+nで5～255"
      - "LEN=01hの固定空ACKではない"
      - "リーダACKと透過先タグの処理成功は別"

  - id: GQ-284
    question: "ThroughCmdで送信のみを選ぶと正常無応答ですか。それともFFhだけのACKですか。"
    expected_source_files:
      - "docs/current/commands/cards/55_ff_uhf_through_cmd.md"
    must_include_facts:
      - "種別0の要求受信bit長は0000h"
      - "p.309は受信bit長1～2008とデータ1～251で送信のみの応答が明示されていない"
      - "OPEN-027で応答有無と構造を保留"
      - "固定空ACKや正常無応答を推測しない"

  - id: GQ-285
    question: "ThroughCmdで受信CRCを返さない設定なら返却bit長から16を引いて解析すればよいですか。"
    expected_source_files:
      - "docs/current/commands/cards/55_ff_uhf_through_cmd.md"
    must_include_facts:
      - "bit5=1は受信CRCをホストへ付加しない"
      - "返却bit長がCRCを含むか除くかとpayload長の対応はOPEN-028で保留"
      - "要求受信bit長はHeaderからCRCまでという原典定義を保持"
      - "返却値へ独自の16 bit減算を確定しない"

  - id: GQ-286
    question: "ThroughCmd前にリーダへAccessパスワードを設定すれば自動認証してSecuredになりますか。"
    expected_source_files:
      - "docs/current/commands/cards/55_ff_uhf_through_cmd.md"
    must_include_facts:
      - "p.226の自動Access対象にThroughCmdは列挙されていない"
      - "リーダ設定だけで自動認証やSecuredを保証しない"
      - "透過先の状態と認証条件を確認する"
      - "write_operationやAccess確認メタデータは全要求で書込みや非ゼロ必須という意味ではない"

  - id: GQ-287
    question: "ThroughCmdをリード系種別にすればタグの書換えはできなくなりますか。"
    expected_source_files:
      - "docs/current/commands/cards/55_ff_uhf_through_cmd.md"
    must_include_facts:
      - "種別だけで送信内容の影響を判断しない"
      - "ホストが作るタグコマンドにはBlockWrite等も含められる"
      - "書込みと認証条件は透過先コマンドに依存する"
      - "timeout後に未実行と断定して自動再送しない"

  - id: GQ-288
    question: "M730 Margin Readの例は96 bitのEPCをそのまま読んで返しますか。"
    expected_source_files:
      - "docs/current/commands/cards/55_ff_uhf_through_cmd.md"
    must_include_facts:
      - "掲載例の送信は130 bit/17 byte"
      - "受信は33 bit/5 byteでHeader1+Handle16+CRC16"
      - "通常Readの96 bitデータ応答として扱わない"
      - "M730例を他のチップへ一般化しない"

  - id: GQ-289
    question: "GetHandleとThroughCmdはSUN02-4CHなら全ROMで対応していますか。"
    expected_source_files:
      - "docs/current/commands/cards/55_46_uhf_get_handle.md"
      - "docs/current/commands/cards/55_ff_uhf_through_cmd.md"
    must_include_facts:
      - "p.108と110はS201・SHR201・SUN02-4CHをROM別の列に置く"
      - "2.040以前は非対応、2.050以降/2.100以降は対応"
      - "全バージョン列はSUN02-8CHとSUN02V-8CH"
      - "4CHを8CH列へ混在させない"

  - id: GQ-290
    question: "連続モードのままGetHandleで値を読んでThroughCmdを送ってよいですか。"
    expected_source_files:
      - "docs/current/commands/cards/55_46_uhf_get_handle.md"
      - "docs/current/commands/cards/55_ff_uhf_through_cmd.md"
    must_include_facts:
      - "両コマンドは65h/66h中の受付例外ではない"
      - "モード書込みで00hへ戻す条件を確認する"
      - "処理終了後は直ちにキャリアOFFが推奨"
      - "出力開始から最大4秒やHandle破棄後は旧値を再利用しない"
