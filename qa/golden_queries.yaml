version: 1
description: "RAG品質を人間レビューで確認するための代表質問セット。自動評価器はまだ前提にしない。"
queries:
  - id: GQ-001
    question: "UTR-S201シリーズの通常コマンドは全部で何件あり、区分ごとの件数はいくつですか。"
    expected_source_files:
      - "docs/current/COMMAND_MASTER_V117.md"
      - "docs/current/RESPONSE_CLASSIFICATION_MATRIX.md"
    must_include_facts:
      - "通常コマンドは54件"
      - "リーダライタ制御コマンドは12件"
      - "リーダライタ設定コマンドは31件"
      - "RFタグ通信コマンドは11件"

  - id: GQ-002
    question: "PDF 7.1 と 7.2 は、通常の上位送信コマンド54件に含めますか。"
    expected_source_files:
      - "docs/current/COMMAND_MASTER_V117.md"
    must_include_facts:
      - "PDF 7.1 と 7.2 は通常の上位送信コマンド54件には含めない"
      - "自動読み取りや非同期レスポンス動作の説明として扱う"

  - id: GQ-003
    question: "ROMバージョン読み取り後、機種判定と実装可否確認はどの順番で進めますか。"
    expected_source_files:
      - "docs/current/DEVICE_ROM_IDENTIFICATION_AND_SUPPORT.md"
      - "docs/current/commands/cards/rom_version_read.md"
    must_include_facts:
      - "ROM番号とシリーズ名を解析する"
      - "シリーズ名から対象機種を判定する"
      - "対象機種とROMバージョンに対応するコマンドか確認する"

  - id: GQ-004
    question: "シリーズ名 USM02 はどの機種として扱いますか。4CH機として確認すべき点も答えてください。"
    expected_source_files:
      - "docs/current/DEVICE_ROM_IDENTIFICATION_AND_SUPPORT.md"
      - "docs/current/commands/cards/55_33_00_write_antenna_switching.md"
    must_include_facts:
      - "USM02 は UTR-SUN02-4CH"
      - "4CH機として扱う"
      - "物理アンテナ容量、接続OKアンテナ、使用アンテナ設定を確認する"

  - id: GQ-005
    question: "ACKをコマンド番号だけで固定解釈してはいけない理由は何ですか。"
    expected_source_files:
      - "docs/current/RESPONSE_AND_NACK_MASTER.md"
      - "docs/current/DEVICE_ROM_IDENTIFICATION_AND_SUPPORT.md"
    must_include_facts:
      - "起動時または実機送信前のスナップショットに基づいてACKを解釈する"
      - "対象コマンドのPDF定義と機種・ROM・設定の適用範囲を確認する"
      - "TID付加や自動読み取りの通知設定を全コマンドのACKへ一般化しない"

  - id: GQ-006
    question: "RFタグ通信系の受信処理で、1送信1応答と決め打ちしてはいけないのはなぜですか。"
    expected_source_files:
      - "docs/current/RESPONSE_AND_NACK_MASTER.md"
      - "docs/current/commands/cards/55_10_uhf_inventory.md"
    must_include_facts:
      - "RFタグ通信系では複数フレームを受信する場合がある"
      - "単発コマンドの完了と、自動読み取り中のサイクル・切替・キャリア通知を分ける"
      - "自動読み取りの通知OFFを、単発Inventoryの完了応答へ適用しない"

  - id: GQ-007
    question: "NACK、timeout、無応答は実装上どのように扱い分けるべきですか。"
    expected_source_files:
      - "docs/current/RESPONSE_AND_NACK_MASTER.md"
      - "docs/current/AI_IMPLEMENTATION_GUARDRAILS.md"
    must_include_facts:
      - "ACK、NACK、timeout、無応答を同じエラーとして扱わない"
      - "NACK時はエラーコードをログに残す"
      - "NACKは共通NACK形式と対象コマンドのPDF該当節を併せて確認する"

  - id: GQ-008
    question: "RF送信信号の制御を実装または実機送信するとき、AIが独断で決めてはいけないことは何ですか。"
    expected_source_files:
      - "docs/current/RF_SAFETY_AND_CARRIER_RULES.md"
      - "docs/current/commands/cards/4e_9e_rf_carrier_control.md"
      - "docs/current/AI_IMPLEMENTATION_GUARDRAILS.md"
    must_include_facts:
      - "RF送信信号制御は仕様書に記載された機能"
      - "対象地域、対象機種、ROM、アンテナ構成、現場条件を確認する"
      - "AIが独断で周波数、送信出力、アンテナ番号、継続判断を決めない"

  - id: GQ-009
    question: "LBTエラーやアンテナエラーが発生した場合、AIは再送や継続を自動判断してよいですか。"
    expected_source_files:
      - "docs/current/RF_SAFETY_AND_CARRIER_RULES.md"
      - "docs/current/AI_IMPLEMENTATION_GUARDRAILS.md"
    must_include_facts:
      - "LBTエラー、アンテナエラー、timeout、NACKはログに残す"
      - "作業指示で決めた停止条件に従う"
      - "AI判断だけで再送、継続、別設定への変更を行わない"

  - id: GQ-010
    question: "実機確認ステータス索引では、54枚のカードはどのverification_statusに整理されていますか。"
    expected_source_files:
      - "docs/current/commands/cards/TEST_STATUS_INDEX.md"
    must_include_facts:
      - "整理対象のカード枚数は54件"
      - "SPECIFICATION_REFERENCE が54件"
      - "全54コマンドを個別に実機送信済みであることを示すものではない"
      - "公式PDFを仕様上の期待結果の基準とする"

  - id: GQ-011
    question: "完成HexやSUM計算済み送信用コマンド例は、このリポジトリでどう扱いますか。"
    expected_source_files:
      - "docs/current/COMMAND_MASTER_V117.md"
      - "docs/current/AI_IMPLEMENTATION_GUARDRAILS.md"
      - "RELEASE_SCOPE.md"
    must_include_facts:
      - "完成HexやSUM計算済みの送信用コマンド例は不用意に出力しない"
      - "実機送信する場合は対象、設定値、影響範囲、復旧方法、停止条件、ログ方針を明確にする"
      - "公式PDFが一次情報"

  - id: GQ-012
    question: "GitHubにアップロードしてはいけない情報には何がありますか。"
    expected_source_files:
      - "README.md"
      - "docs/current/AI_IMPLEMENTATION_GUARDRAILS.md"
      - "RELEASE_SCOPE.md"
    must_include_facts:
      - "runtime logs、実CSVログ、顧客情報、実IPアドレスをアップロードしない"
      - "raw EPC / UII / TID、認証情報、パスワードをアップロードしない"
      - "実機ログ由来のタグ固有値やパスワードを含むHexはマスクする"

  - id: GQ-013
    question: "周波数設定の書き込みと読み取りで参照すべきカードはどれですか。"
    expected_source_files:
      - "docs/current/commands/cards/55_33_02_write_frequency.md"
      - "docs/current/commands/cards/55_43_02_read_frequency.md"
      - "docs/current/RF_SAFETY_AND_CARRIER_RULES.md"
    must_include_facts:
      - "書き込み側は 55_33_02_write_frequency.md"
      - "読み取り側は 55_43_02_read_frequency.md"
      - "周波数変更は対象地域、対象機種、ROM、現場条件を確認する"

  - id: GQ-014
    question: "FLASHに影響する設定変更を扱う場合、どの文書を確認すべきですか。"
    expected_source_files:
      - "docs/current/RAM_FLASH_IMPACT_MATRIX.md"
      - "docs/current/COMMAND_MASTER_V117.md"
      - "docs/current/commands/cards/4e_b4_flash_write.md"
    must_include_facts:
      - "RAM設定かFLASH設定かを確認する"
      - "一時変更、復元、再起動後保持の扱いを決める"
      - "対象、値、影響範囲、復旧方法、停止条件を明確にする"

  - id: GQ-015
    question: "AIに実装を依頼する前に、最低限確認すべき項目は何ですか。"
    expected_source_files:
      - "docs/current/AI_IMPLEMENTATION_GUARDRAILS.md"
      - "docs/current/V100_USAGE_GUIDE.md"
    must_include_facts:
      - "対象機種、ROMバージョン、接続方式、対象コマンドを確認する"
      - "必要パラメータ、分類、ACK/NACK/timeoutの扱いを確認する"
      - "ログ方針、実機送信の有無、停止条件、復旧方法を確認する"

  - id: GQ-016
    question: "この資料を使うにはメーカーSDKとWindowsが必須ですか。"
    expected_source_files:
      - "README.md"
      - "docs/current/TASK_READING_GUIDE.md"
    must_include_facts:
      - "メーカーSDKを必須とせず公開プロトコルから実装する"
      - "USB/COMとLAN/TCPを区別する"
      - "SDK不要という方針だけで全OSのドライバや接続手段の動作確認済みとはしない"

  - id: GQ-017
    question: "単発InventoryでNACK code1=68hが返りました。正常なタグ0枚として継続できますか。"
    expected_source_files:
      - "docs/current/RESPONSE_AND_NACK_MASTER.md"
      - "docs/current/SOURCE_REVIEW_STATUS.md"
      - "docs/current/commands/cards/55_10_uhf_inventory.md"
    must_include_facts:
      - "68hはアンテナ接続異常であり正常なタグ0枚ではない"
      - "正常0枚は読み取り完了応答で扱う"
      - "PDF Ver.1.17の7.5.1 p.263-264と7.6 p.317を根拠にする"

  - id: GQ-018
    question: "GUI制作記録の8 passedは、そこで説明されたNACK処理の正しさを証明しますか。"
    expected_source_files:
      - "docs/current/UTR_TAG_GUI_IMPLEMENTATION_FEEDBACK.md"
      - "docs/current/VERIFICATION_POLICY.md"
    must_include_facts:
      - "過去の報告値であり今回再実行した結果ではない"
      - "NACKをタグ未検知とした当時の期待値は誤り"
      - "テスト成功だけでPDF仕様への適合を証明しない"

  - id: GQ-019
    question: "listen中には完了や枚数の応答が一切ないので、通知設定を確認しなくてよいですか。"
    expected_source_files:
      - "docs/current/RESPONSE_MODE_APPLICABILITY.md"
      - "docs/current/KNOWN_AI_FAILURE_PATTERNS.md"
    must_include_facts:
      - "自動読み取りでも設定によりサイクル終了時の枚数応答が返る"
      - "通知OFF・ON・設定不明を区別する"
      - "サイクル通知は継続受信全体の終了を意味しない"
      - "PDF 7.1 p.114、7.2 p.120、7.4.25 p.233-234を参照する"

  - id: GQ-020
    question: "TIDの4 Wordは96 bitですか。UTRが最大6 Wordを付加するなら、すべてのTIDは最大96 bitですか。"
    expected_source_files:
      - "docs/current/TID_MEMORY_AND_UNITS.md"
      - "docs/current/commands/cards/55_14_uhf_inventory_read.md"
    must_include_facts:
      - "GS1 Gen2の1 Wordは16 bit"
      - "4 Wordは64 bit、6 Wordは96 bit"
      - "UTRのTID付加機能の上限をTID一般の最大長としない"
      - "原典転記とGS1に基づく訂正注記を区別する"

  - id: GQ-021
    question: "UTR-116.pdfとUTR-S201-117.pdfは、版番号の違いだけなのでコマンドカードの原典を一括置換できますか。"
    expected_source_files:
      - "docs/current/SOURCE_REVIEW_STATUS.md"
      - "docs/current/DEVICE_ROM_IDENTIFICATION_AND_SUPPORT.md"
    must_include_facts:
      - "UTR-116はUTR-SU01-3CHとUTR-SN01-3CH用でUMP01を扱う"
      - "UTR-S201-117とは対象機種・シリーズが異なる"
      - "同名コマンドでも対象機種・ROM・該当仕様を確認して分ける"

  - id: GQ-022
    question: "Markdownの文字数がPDFより少なければ、クレジット削減と正確さの改善を実証済みと説明できますか。"
    expected_source_files:
      - "docs/QUALITY_EVALUATION_PLAN.md"
      - "README.md"
    must_include_facts:
      - "文字数をトークン数やクレジット消費へ直接換算しない"
      - "同じ条件で正答性・根拠・実際の利用量を比較する"
      - "比較実験は未実施であり改善を実証済みとはしない"

  - id: GQ-023
    question: "公式PDF掲載の完成Hex例と、タグ値をマスクした構造例は、そのまま同じように送信できますか。"
    expected_source_files:
      - "README.md"
      - "RELEASE_SCOPE.md"
      - "docs/current/commands/cards/55_10_uhf_inventory.md"
    must_include_facts:
      - "PDF掲載例は仕様説明として記載できるが実機送信の許可ではない"
      - "マスク・構造例は実行可能なフレームではない"
      - "掲載SUMをマスク値の置換後の値として使わない"

  - id: GQ-024
    question: "自動読み取り用のサイクル通知をOFFにしました。単発InventoryとInventoryReadでも完了ACKを待たず成功としてよいですか。"
    expected_source_files:
      - "docs/current/commands/cards/55_10_uhf_inventory.md"
      - "docs/current/commands/cards/55_14_uhf_inventory_read.md"
      - "docs/current/RESPONSE_MODE_APPLICABILITY.md"
    must_include_facts:
      - "自動読み取り用の通知OFFを単発コマンドへ適用しない"
      - "単発の正常終了は対象コマンドの完了応答を確認する"
      - "完了前に期限を過ぎた場合、観測済みタグと未完了の判定を分ける"

  - id: GQ-025
    question: "単発InventoryReadでTID付加をOFFにしたら、tid_lengthの1バイトも取り除いて解析できますか。"
    expected_source_files:
      - "docs/current/commands/cards/55_14_uhf_inventory_read.md"
    must_include_facts:
      - "TID長の1バイトは残り、値は0"
      - "後続TIDデータが0バイトであることと、長さフィールドの省略は異なる"
      - "PDF 7.5.2 p.268と3.9 p.59の付加OFF例を確認する"

  - id: GQ-026
    question: "単発Inventoryの完了ACKのDATA[1]は、成功ステータスですか。InventoryReadと同じ定義ですか。"
    expected_source_files:
      - "docs/current/commands/cards/55_10_uhf_inventory.md"
      - "docs/current/commands/cards/55_14_uhf_inventory_read.md"
    must_include_facts:
      - "Inventoryでは予約領域で通常00h、成功・失敗の意味を与えない"
      - "InventoryReadでは00h固定値として記載される"
      - "両者ともCMD、LEN、詳細識別子と対象モードを確認して解釈する"

  - id: GQ-027
    question: "InventoryReadでタグデータ応答がありません。EPCを持つタグが物理的に存在しないと断定できますか。"
    expected_source_files:
      - "docs/current/commands/cards/55_14_uhf_inventory_read.md"
    must_include_facts:
      - "指定メモリや付加対象TIDが読めない場合、EPCが読めてもタグデータ応答は返らない"
      - "タグデータ応答の不在だけで物理的なタグ不在を断定しない"
      - "正常な完了0件とNACKと未完了を区別する"

  - id: GQ-028
    question: "Inventory設定とEPC/UII設定をパラメータ種類00hへ書くと、01hも同じ値になりますか。"
    expected_source_files:
      - "docs/current/RAM_FLASH_IMPACT_MATRIX.md"
      - "docs/current/commands/cards/55_31_uhf_set_inventory_param.md"
      - "docs/current/commands/cards/55_33_05_write_epc_uii_params.md"
    must_include_facts:
      - "Inventory設定の両RAMは独立し、指定RAMだけが変わる"
      - "EPC/UII設定は両RAMへ同じ内容が反映される"
      - "どちらもRAMへの書込みではFLASHを変更しない"
      - "PDF 3.12.3 p.73-74を根拠にする"

  - id: GQ-029
    question: "Inventory設定をFLASHへ保存した場合、再起動までは動作中のRAMは変わらないので復元不要ですか。"
    expected_source_files:
      - "docs/current/RAM_FLASH_IMPACT_MATRIX.md"
    must_include_facts:
      - "FLASH書込みは動作中の両RAMにも反映される"
      - "起動・リスタート時もFLASHから両RAMへコピーされる"
      - "FLASHの復元でも両RAMが変わるため、変更前RAM値が異なる場合はその復元も必要"
      - "この2系統の規則を特殊な設定を含む全コマンドに一般化しない"

  - id: GQ-030
    question: "SetInventoryParamのACKでDATA[0]=31hが来ました。NACKですか。DATA[1]で成功や保存先を確認できますか。"
    expected_source_files:
      - "docs/current/commands/cards/55_31_uhf_set_inventory_param.md"
      - "docs/current/commands/cards/55_41_uhf_get_inventory_param.md"
    must_include_facts:
      - "成功ACKはCMD=30h、LEN=01h、DATA[0]=31h"
      - "NACKのCMD=31hとDATAの詳細識別子を混同しない"
      - "DATA[1]は存在せず設定値や種類は返らない"
      - "要求との対応を管理しGetInventoryParamで影響する保存先を読戻す"

  - id: GQ-031
    question: "EPC/UII設定読取りでCMD=30h、DATA[0]=43hなら、サブコマンドや要求した種類が違っても成功ですか。自動通知OFFならACK長も変わりますか。"
    expected_source_files:
      - "docs/current/commands/cards/55_43_05_read_epc_uii_params.md"
      - "docs/current/commands/cards/55_33_05_write_epc_uii_params.md"
    must_include_facts:
      - "読取りACKはLEN=04h、詳細43h、サブ05h、要求した種類との一致を確認する"
      - "bit1-3は自動読み取り用通知の設定で、単発コマンドの完了条件へ転用しない"
      - "設定ACKの固定長は通知設定で変わらない"
      - "書込みACKは詳細33hで、種類とflagsも返る"

  - id: GQ-032
    question: "GetInventoryParamのTID付加bitから単発InventoryReadを解析できますか。PDF記載の設定書込み先7.4.13へ進めばよいですか。"
    expected_source_files:
      - "docs/current/commands/cards/55_41_uhf_get_inventory_param.md"
      - "docs/current/commands/cards/55_31_uhf_set_inventory_param.md"
      - "docs/current/commands/cards/55_14_uhf_inventory_read.md"
    must_include_facts:
      - "GetInventoryParamのACKはLEN=0Bhで要求した種類との一致を確認する"
      - "パラメータ4と読み取り開始Word・Word数は連続インベントリリード用"
      - "単発InventoryReadは自身のコマンド指定を使う"
      - "Ver.1.17のSetInventoryParamは7.4.18で、原典転記と参照先補足を区別する"

  - id: GQ-033
    question: "8CH機で55h/43h/00hのアンテナ切替設定を読めたので、55h/33h/00hで同じ値を書き戻せますか。"
    expected_source_files:
      - "docs/current/commands/cards/55_43_00_read_antenna_switching.md"
      - "docs/current/commands/cards/55_33_00_write_antenna_switching.md"
    must_include_facts:
      - "PDF 6.2.2 p.109では読取りは8CH機も対応だが書込みは非対応"
      - "7.4.20 p.212では8CH機で書込みを実行するとNACK"
      - "読めることから同形式で書けると判断しない"

  - id: GQ-034
    question: "4CH機のFLASHにAnt0とAnt2を使用指定しました。コマンド用RAMがAnt0だけなら反映失敗ですか。"
    expected_source_files:
      - "docs/current/RAM_FLASH_IMPACT_MATRIX.md"
      - "docs/current/commands/cards/55_33_00_write_antenna_switching.md"
    must_include_facts:
      - "FLASHへの複数指定は自動用RAMへ同じ選択、コマンド用RAMへ最小番号の1本が反映される"
      - "この例のコマンド用RAMがAnt0だけなのは仕様通り"
      - "全て不使用とコマンド用RAMへの複数指定はNACK"
      - "使用有無のbit maskを単一のアンテナ番号と混同しない"

  - id: GQ-035
    question: "連続InventoryReadでCMD=30h、LEN=02h、DATA=[14h,01h]を受けました。ADRはアンテナ番号で、タグ0枚が確定したという意味ですか。"
    expected_source_files:
      - "docs/current/RESPONSE_MODE_APPLICABILITY.md"
      - "docs/current/ANTENNA_NUMBERING_SCHEMES.md"
    must_include_facts:
      - "これは連続InventoryReadのアンテナ切替終了通知"
      - "通知ONと対象機種の切替条件を確認し、全使用アンテナの終了を各アンテナ終了と混同しない"
      - "アンテナID出力ONでもADRはリーダライタID"
      - "タグ読取り成否に依存せず、枚数フィールドもないため通知単独で0枚と断定しない"
